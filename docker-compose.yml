services:
  billmanage:
    build:
      context: .
      args:
        # 国内拉取基础镜像：通过 daocloud 的 Docker Hub 代理；如不稳定可换成
        # registry.cn-hangzhou.aliyuncs.com 等其它可用代理，或保持 python:3.13-slim
        PYTHON_IMAGE: docker.m.daocloud.io/python:3.13-slim
        # uv 官方镜像经 DaoCloud 代理拉取；避免在构建中执行 pip install uv。
        UV_IMAGE: m.daocloud.io/ghcr.io/astral-sh/uv:0.12.1
        # 腾讯云服务器直接使用腾讯云 PyPI 镜像。UV_FILES_BASE 用于改写
        # uv.lock 中 frozen 模式仍会访问的 files.pythonhosted.org 完整 URL。
        UV_DEFAULT_INDEX: https://mirrors.cloud.tencent.com/pypi/simple
        UV_FILES_BASE: https://mirrors.cloud.tencent.com/pypi
        # 如果所有镜像仍很慢，可走服务器上已运行的 clash 代理（日本节点）：
        # 网关地址先查：docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}'
        # HTTP_PROXY: http://<网关IP>:7890
        # HTTPS_PROXY: http://<网关IP>:7890
    image: billmanage:latest
    container_name: billmanage
    restart: unless-stopped
    ports:
      # 端口映射格式：容器内的 8000（uvicorn 监听端口）→ 宿主机的 8000。
      # host_ip 用 127.0.0.1 = 只在服务器本机回环地址上监听，
      # 公网网卡不开放此端口；组内成员通过 tailscale serve 的 HTTPS 访问。
      - target: 8000
        published: 8000
        host_ip: 127.0.0.1
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./报销单模版.xlsx:/app/报销单模版.xlsx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
